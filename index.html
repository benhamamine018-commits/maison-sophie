
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Sophie | القفطان والجلابة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf7f1;color:#292018;font-family:Tahoma,Arial}
header{background:#241b16;color:white;padding:20px;text-align:center}
.logo{font:30px Georgia;color:#d9b779;letter-spacing:2px}
nav{margin-top:15px}
nav a{color:white;text-decoration:none;margin:12px}
.hero{text-align:center;background:linear-gradient(120deg,#241b16,#80613e);color:white;padding:65px 15px}
.hero h1{font-size:36px}
.hero p{line-height:2}
section{padding:30px 4%}
h2{text-align:center;color:#805d35}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{background:white;padding:10px;box-shadow:0 3px 15px #0001}
.product img{width:100%;height:230px;object-fit:cover;background:#eee}
.product h3{text-align:center}
select{width:100%;padding:12px;margin:5px 0;border:1px solid #c8b18c;background:white}
.order{display:block;text-align:center;background:#1eaa63;color:white;text-decoration:none;padding:12px;margin-top:10px}
footer{background:#241b16;color:white;text-align:center;padding:30px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.product img{height:180px}}
</style>
</head>
<body>

<header>
<div class="logo">MAISON SOPHIE</div>
<nav>
<a href="#home">الرئيسية</a>
<a href="#women">النساء</a>
<a href="#men">الرجال</a>
</nav>
</header>

<div class="hero" id="home">
<h1>أناقة مغربية أصيلة</h1>
<p>قفاطين وجلابيب نسائية ورجالية<br>
بيع وكراء لجميع المناسبات</p>
</div>

<section id="women">
<h2>مجموعة النساء</h2>
<div class="grid" id="women-grid"></div>
</section>

<section id="men">
<h2>مجموعة الرجال</h2>
<div class="grid" id="men-grid"></div>
</section>

<footer>
<h2 style="color:#d9b779">MAISON SOPHIE</h2>
<p>شكراً لزيارتكم</p>
</footer>

<script>
const women=[
"قفطان ملكي","تكشيطة ذهبية","قفطان سهرة","جلابة نسائية",
"قفطان أخضر","تكشيطة تقليدية","قفطان أبيض","جلابة عصرية",
"قفطان مخملي","قفطان مطرز","تكشيطة فاخرة","قفطان باستيل",
"جلابة صيفية","قفطان مناسبات","قفطان حرير","تكشيطة ملكية",
"جلابة مطرزة","قفطان أنيق","قفطان أصيل","جلابة راقية",
"قفطان سهرة","تكشيطة عصرية","قفطان ذهبي","جلابة تقليدية",
"قفطان Sophie"
];

const men=[
"جلابة بيضاء","جلابة شتوية","جلابة مطرزة","جلابة كلاسيكية",
"جلابة كريمية","جلابة مناسبات","جلابة أنيقة","جلابة صيفية",
"جلابة رمادية","جلابة فاخرة","جلابة تقليدية","جلابة عصرية",
"جلابة دافئة","جلابة راقية","جلابة بنية","جلابة للمناسبات",
"جلابة يدوية","جلابة مغربية","جلابة سوداء","جلابة رملية",
"جلابة فاخرة","جلابة يومية","جلابة حديثة","جلابة أصيلة",
"جلابة Maison Sophie"
];

function addProducts(names,id,category){
const grid=document.getElementById(id);

names.forEach((name,i)=>{
const card=document.createElement("div");
card.className="product";

const img=document.createElement("img");
img.src="https://loremflickr.com/500/650/moroccan,caftan?lock="+(i+(category==="نساء"?10:50));
img.alt=name;
img.loading="lazy";

const title=document.createElement("h3");
title.textContent=name;

const size=document.createElement("select");
size.innerHTML='<option value="">اختر المقاس</option>'+
["S","M","L","XL","XXL"].map(x=>`<option>${x}</option>`).join("");

const type=document.createElement("select");
type.innerHTML='<option value="">اختر نوع الطلب</option>'+
'<option value="شراء">شراء</option>'+
'<option value="كراء">كراء</option>';

const button=document.createElement("a");
button.className="order";
button.textContent="اطلب عبر واتساب";
button.href="#";

button.onclick=function(e){
e.preventDefault();
if(!size.value||!type.value){
alert("المرجو اختيار المقاس ونوع الطلب");
return;
}
const message="السلام عليكم، أريد "+type.value+
" الموديل: "+name+
" | القسم: "+category+
" | المقاس: "+size.value;
window.open("https://wa.me/212636101436?text="+encodeURIComponent(message),"_blank");
};

card.append(img,title,size,type,button);
grid.appendChild(card);
});
}

addProducts(women,"women-grid","نساء");
addProducts(men,"men-grid","رجال");
</script>
</body>
</html>
